<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9f8">
<title>Reading preview</title>
<style>
:root{color-scheme:light;--paper:#fff9f8;--ink:#201416;--muted:#775e63;--line:#ecd9dc;--band:#ffe5e5;--accent:#a1344d;--panel:#fff9f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
[data-theme=dark]{color-scheme:dark;--paper:#000;--ink:#fff;--muted:#aaa;--line:#2c2c2c;--band:transparent;--accent:#ff9bad;--panel:#111}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);overflow:hidden}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,main:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1100px;margin:auto;padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px,env(safe-area-inset-left))}
header{display:flex;justify-content:flex-end;padding:6px 0}
.eyebrow{color:var(--accent);font-size:10px;font-weight:750;letter-spacing:.2em;text-transform:uppercase}
.icon{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent}.icon:hover{background:var(--band);outline:1px solid var(--line)}.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
main{position:relative;display:grid;align-items:stretch;min-height:0;touch-action:none;user-select:none;cursor:ns-resize;padding:9px 0;outline-offset:-3px}
.trail{display:grid;grid-template-rows:repeat(3,minmax(0,1fr)) minmax(0,1.85fr) repeat(3,minmax(0,1fr));gap:clamp(4px,1.25vh,12px);min-height:0}.trail[data-typeface="serif"]{font-family:Georgia,"Times New Roman",serif}.trail[data-motion="scroll"]{overflow:hidden}.trail[data-motion="scroll"] .row{overflow:visible}
.row{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;line-height:1;padding-inline:8px}.row span{display:block}.row[data-distance="0"]{letter-spacing:-.035em}.row[data-distance="1"] span{opacity:calc(var(--fade,.65)*.9)}.row[data-distance="2"] span{opacity:calc(var(--fade,.65)*.62)}.row[data-distance="3"] span{opacity:calc(var(--fade,.65)*.38)}
.picture{position:absolute;inset:9px 0;display:grid;place-items:center;min-height:0}.picture img{display:block;width:auto;height:auto;max-width:100%;max-height:min(90vh,100%);border-radius:8px;object-fit:contain}.picture[hidden],.trail[hidden]{display:none}
footer{width:min(100%,480px);justify-self:center;padding:7px 3px 13px}.meta{display:flex;justify-content:space-between;gap:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.hint{text-align:center;color:var(--muted);font-size:11px;margin:0}input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.scrubber{position:relative;display:grid;align-items:center;height:36px}.scrubber::before,.scrubber::after{content:'';position:absolute;inset-inline:5px;height:3px;border-radius:3px;background:var(--line);pointer-events:none}.scrubber::after{background:var(--accent);transform:scaleX(var(--progress,0));transform-origin:left}.scrubber input{position:relative;z-index:1;appearance:none;height:100%;background:transparent;border-radius:8px}.scrubber input::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent)}.scrubber input::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--accent)}
.theme-setting{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:14px;cursor:pointer}.theme-setting input{width:18px;height:18px;accent-color:var(--accent)}
.theme-setting select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.trail[data-tint="true"] [data-tone="0"]{color:#c679ba}.trail[data-tint="true"] [data-tone="1"]{color:#50918b}.trail[data-tint="true"] [data-tone="2"]{color:#4b3e28}
.row[data-distance="0"] span{white-space:pre;text-align:center}
.focus-guide{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(var(--focus-height,40px) / 2 + 10px));pointer-events:none;z-index:2}
.focus-guide[hidden]{display:none}
.focus-guide span{display:block;width:14px;height:3px;border-radius:2px;background:var(--ink);opacity:.5;transform-origin:center}
[data-theme="dark"] .trail[data-tint="true"] [data-tone="0"]{color:#f2e3ee}[data-theme="dark"] .trail[data-tint="true"] [data-tone="1"]{color:#def1ee}[data-theme="dark"] .trail[data-tint="true"] [data-tone="2"]{color:#f3e9d8}
dialog{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;width:min(420px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto}dialog::backdrop{background:#0008}dialog h2{margin:0;font-size:20px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head button,.jump{border:1px solid var(--line);border-radius:10px;background:transparent;min-height:44px;padding:8px 12px}.setting{display:grid;gap:6px;margin:16px 0}.setting label{display:flex;justify-content:space-between;font-size:14px}.setting output{color:var(--muted)}.jumps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.jump:hover,.sheet-head button:hover{border-color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(min-width:700px){.app{padding-inline:28px}footer{padding-bottom:16px}}
@media(max-height:480px){header{padding-block:4px}footer{padding-block:4px}main{padding-block:4px}.trail{gap:3px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="icon" id="settings" type="button" aria-label="Reading options" title="Reading options" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--paper)"/><circle cx="15" cy="17" r="2.5" fill="var(--paper)"/></svg></button>
  </header>
  <main id="stage" tabindex="0" aria-label="Reading area" aria-describedby="hint">
    <div class="trail" id="trail" aria-hidden="true"></div>
    <div class="picture" id="picture" hidden><img id="art" alt=""></div>
    <div class="focus-guide" id="focus-guide" aria-hidden="true" hidden><span></span></div>
    <div id="spoken" class="sr" aria-live="polite" aria-atomic="true"></div>
  </main>
  <footer>
    <div class="meta"><span id="position"></span><span id="percentage"></span></div>
    <div class="scrubber" id="scrubber">
      <input id="progress" type="range" min="0" value="0" aria-label="Reading position">
    </div>
    <p class="hint" id="hint">Swipe up or scroll to read</p>
  </footer>
</div>
<dialog id="panel" aria-labelledby="settings-title">
  <form method="dialog">
    <div class="sheet-head"><h2 id="settings-title">Reading options</h2><button>Done</button></div>
  </form>
  <label class="theme-setting" for="theme">Dark mode <input id="theme" type="checkbox"></label>
  <label class="theme-setting" for="motion">Word movement
    <select id="motion"><option value="fixed">Fixed</option><option value="scroll">Scroll</option></select>
  </label>
  <label class="theme-setting" for="typeface">Reading typeface
    <select id="typeface"><option value="sans">Sans serif</option><option value="serif">Serif</option></select>
  </label>
  <label class="theme-setting" for="focus-count">Words in focus
    <select id="focus-count"><option>1</option><option>2</option><option>3</option><option>4</option></select>
  </label>
  <label class="theme-setting" for="sentence-tint">Sentence tint <input id="sentence-tint" type="checkbox"></label>
  <label class="theme-setting" for="guide-mode">Focus guide
    <select id="guide-mode"><option value="off">Off</option><option value="static">Static</option><option value="responsive">Scroll side-to-side</option></select>
  </label>
  <div class="setting"><label for="size">Focus word size <output id="size-value"></output></label><input id="size" type="range" min="70" max="130" step="5" value="100"></div>
  <div class="setting"><label for="fade">Context visibility <output id="fade-value"></output></label><input id="fade" type="range" min="30" max="100" step="5" value="65"></div>
  <div class="setting"><label for="step">Swipe distance per item <output id="step-value"></output></label><input id="step" type="range" min="20" max="80" step="5" value="40"></div>
  <div class="eyebrow">Jump to a scene</div><div class="jumps" id="jumps"></div>
  <p class="meta">The Elves and the Shoemaker · Brothers Grimm</p>
</dialog>
<script>
const scenes = [
  "There was once a shoemaker, who worked very hard and was very honest: but still he could not earn enough to live upon; and at last all he had in the world was gone, save just leather enough to make one pair of shoes.\n\nThen he cut his leather out, all ready to make up the next day, meaning to rise early in the morning to his work. His conscience was clear and his heart light amidst all his troubles; so he went peaceably to bed, left all his cares to Heaven, and soon fell asleep. In the morning after he had said his prayers, he sat himself down to his work; when, to his great wonder, there stood the shoes all ready made, upon the table. The good man knew not what to say or think at such an odd thing happening.\n\nHe looked at the workmanship; there was not one false stitch in the whole job; all was so neat and true, that it was quite a masterpiece.",
  "The same day a customer came in, and the shoes suited him so well that he willingly paid a price higher than usual for them; and the poor shoemaker, with the money, bought leather enough to make two pairs more. In the evening he cut out the work, and went to bed early, that he might get up and begin betimes next day; but he was saved all the trouble, for when he got up in the morning the work was done ready to his hand.\n\nSoon in came buyers, who paid him handsomely for his goods, so that he bought leather enough for four pair more. He cut out the work again overnight and found it done in the morning, as before; and so it went on for some time: what was got ready in the evening was always done by daybreak, and the good man soon became thriving and well off again.",
  "One evening, about Christmas-time, as he and his wife were sitting over the fire chatting together, he said to her, ‘I should like to sit up and watch tonight, that we may see who it is that comes and does my work for me.’ The wife liked the thought; so they left a light burning, and hid themselves in a corner of the room, behind a curtain that was hung up there, and watched what would happen.\n\nAs soon as it was midnight, there came in two little naked dwarfs; and they sat themselves upon the shoemaker’s bench, took up all the work that was cut out, and began to ply with their little fingers, stitching and rapping and tapping away at such a rate, that the shoemaker was all wonder, and could not take his eyes off them. And on they went, till the job was quite done, and the shoes stood ready for use upon the table. This was long before daybreak; and then they bustled away as quick as lightning.\n\nThe next day the wife said to the shoemaker. ‘These little wights have made us rich, and we ought to be thankful to them, and do them a good turn if we can. I am quite sorry to see them run about as they do; and indeed it is not very decent, for they have nothing upon their backs to keep off the cold. I’ll tell you what, I will make each of them a shirt, and a coat and waistcoat, and a pair of pantaloons into the bargain; and do you make each of them a little pair of shoes.’\n\nThe thought pleased the good cobbler very much; and one evening, when all the things were ready, they laid them on the table, instead of the work that they used to cut out, and then went and hid themselves, to watch what the little elves would do.",
  "About midnight in they came, dancing and skipping, hopped round the room, and then went to sit down to their work as usual; but when they saw the clothes lying for them, they laughed and chuckled, and seemed mightily delighted.\n\nThen they dressed themselves in the twinkling of an eye, and danced and capered and sprang about, as merry as could be; till at last they danced out at the door, and away over the green.\n\nThe good couple saw them no more; but everything went well with them from that time forward, as long as they lived."
];

// Each illustration is embedded so the preview can run offline as a single file.
const illustrations = [
  {
    "name": "The first pair",
    "alt": "A pair of leather shoes on the shoemaker’s bench.",
    "art": "<rect width=\"720\" height=\"960\" fill=\"#382b32\"/><circle cx=\"360\" cy=\"445\" r=\"326\" fill=\"#805c4c\"/><path d=\"M0 640h720v320H0z\" fill=\"#51382c\"/><g fill=\"#a55a36\" stroke=\"#37271f\" stroke-width=\"12\"><path d=\"M150 612q20-63 102-58l42-123h88v153q-90 66-232 28z\"/><path d=\"M330 674q20-63 102-58l42-123h88v153q-90 66-232 28z\"/></g><path d=\"m296 485 57 15m-66 12 64 17m126 20 57 15m-66 12 64 17\" stroke=\"#efd3a6\" stroke-width=\"7\"/>"
  },
  {
    "name": "The midnight workshop",
    "alt": "A candle lights a quiet workbench at midnight.",
    "art": "<rect width=\"720\" height=\"960\" fill=\"#382b32\"/><circle cx=\"360\" cy=\"445\" r=\"326\" fill=\"#805c4c\"/><rect x=\"174\" y=\"143\" width=\"372\" height=\"360\" rx=\"100\" fill=\"#293e53\"/><circle cx=\"431\" cy=\"254\" r=\"59\" fill=\"#f4e1b2\"/><path d=\"M360 148v352M177 327h366\" stroke=\"#6c4834\" stroke-width=\"15\"/><path d=\"M0 690h720v270H0z\" fill=\"#51382c\"/><circle cx=\"315\" cy=\"597\" r=\"110\" fill=\"#e1a563\" opacity=\".35\"/><path d=\"M314 559q-41 47 0 62 38-10 0-62Z\" fill=\"#ffd798\"/><rect x=\"294\" y=\"620\" width=\"41\" height=\"70\" rx=\"5\" fill=\"#eac69a\"/><path d=\"M424 652l130 24m-129-46 98 15\" stroke=\"#b9946c\" stroke-width=\"9\"/>"
  },
  {
    "name": "Gifts for the elves",
    "alt": "Two tiny coats and pairs of shoes laid out on the bench.",
    "art": "<rect width=\"720\" height=\"960\" fill=\"#382b32\"/><circle cx=\"360\" cy=\"445\" r=\"326\" fill=\"#805c4c\"/><path d=\"M0 474h720v486H0z\" fill=\"#51382c\"/><path d=\"m138 480 72-45 71 45 55 111-60 28-25-49v113H167V570l-24 49-61-28Z\" fill=\"#bc7556\"/><path d=\"m438 480 72-45 71 45 55 111-60 28-25-49v113h-84V570l-24 49-61-28Z\" fill=\"#6d9c86\"/><path d=\"M211 460v219m299-219v219\" stroke=\"#ecd4a8\" stroke-width=\"5\"/><path d=\"M144 758q36-22 65-4v35h-82zm89 0q36-22 65-4v35h-82zm193 0q36-22 65-4v35h-82zm89 0q36-22 65-4v35h-82z\" fill=\"#ce9c70\"/>"
  }
];
const $ = id => document.getElementById(id);
const tokens = [];
let wordCount = 0;
let sentence = 0;
for (const [scene, passage] of scenes.entries()) {
  for (const token of passage.split(/\s+/)) {
    const abbreviation = /^(Mr|Mrs|Ms|Dr)\.$/.test(token);
    const ending = abbreviation ? '' : token.match(/[.!?]+[”’"']*$/)?.[0];
    const word = ending ? token.slice(0, -ending.length) : token;
    if (word) tokens.push({word, number: ++wordCount, sentence});
    if (ending) tokens.push({punctuation: ending, sentence: sentence++});
  }
  if (illustrations[scene]) tokens.push({picture: illustrations[scene], number: wordCount, plate: scene + 1});
}
const rows = Array.from({length:7}, (_, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.distance = Math.abs(i - 3);
  const text = row.appendChild(document.createElement('span'));
  $('trail').append(row);
  return text;
});
let items = [];
let last = 0;
let index = 0;
let visibleItems = [];
const animations = [];
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const guideAnimations = [];
let guidePhase = 0;
let prefs = {};
try { prefs = JSON.parse(localStorage.getItem('one-word-prefs')) || {}; } catch {}
function save() { try { localStorage.setItem('one-word-prefs', JSON.stringify(prefs)); } catch {} }

const guideMode = $('guide-mode');
// Enable the requested oscillation once when upgrading an older preview.
guideMode.value = prefs.guideVersion === 2 && ['off','static','responsive'].includes(prefs.guideMode) ? prefs.guideMode : 'responsive';
prefs.guideVersion = 2;
prefs.guideMode = guideMode.value;
save();
$('stage').dataset.guide = guideMode.value;
guideMode.onchange = () => {
  prefs.guideMode = guideMode.value;
  $('stage').dataset.guide = guideMode.value;
  for (const animation of guideAnimations.splice(0)) animation.cancel();
  updateGuide();
  fitWords();
  save();
};

function updateGuide() {
  $('focus-guide').hidden = guideMode.value === 'off' || Boolean(items[index]?.picture);
  positionGuide();
}

function positionGuide() {
  const amplitude = Math.max(0, Math.min(100, $('stage').clientWidth / 2 - 12));
  const offset = guideMode.value === 'responsive' ? Math.sin(guidePhase) * amplitude : 0;
  $('focus-guide').style.left = `calc(50% + ${offset}px)`;
}

function moveGuide(pixels) {
  if (guideMode.value !== 'responsive' || $('focus-guide').hidden) return;
  // One complete left-right cycle follows 800 pixels of vertical input.
  guidePhase = (guidePhase + pixels * Math.PI / 400) % (Math.PI * 2);
  positionGuide();
}

function respondGuide() {
  if (guideMode.value !== 'responsive' || $('focus-guide').hidden || reducedMotion.matches) return;
  for (const animation of guideAnimations.splice(0)) animation.cancel();
  for (const mark of $('focus-guide').children) {
    guideAnimations.push(mark.animate([
      {transform:'scaleX(1)',opacity:.5},
      {transform:'scaleX(1.25)',opacity:.65,offset:.2},
      {transform:'scaleX(1)',opacity:.5}
    ], {duration:360,easing:'ease-out'}));
  }
}

function groupWords(count) {
  const currentToken = items[index]?.start ?? 0;
  const groups = [];
  for (let start = 0; start < tokens.length;) {
    const first = tokens[start];
    let end = start + 1;
    while (first.word && end - start < count && tokens[end]?.word && tokens[end].sentence === first.sentence) end++;
    const group = {...first, start, end};
    if (end > start + 1) {
      group.word = tokens.slice(start, end).map(token => token.word).join(' ');
      group.lastNumber = tokens[end - 1].number;
    }
    groups.push(group);
    start = end;
  }
  items = groups;
  last = items.length - 1;
  $('progress').max = last;
  show(items.findIndex(item => item.start <= currentToken && currentToken < item.end));
}

const focusCount = $('focus-count');
focusCount.value = [1,2,3,4].includes(prefs.focusCount) ? prefs.focusCount : 1;
focusCount.onchange = () => {
  prefs.focusCount = Number(focusCount.value);
  groupWords(prefs.focusCount);
  save();
};
const sentenceTint = $('sentence-tint');
sentenceTint.checked = prefs.sentenceTint === true;
$('trail').dataset.tint = String(sentenceTint.checked);
sentenceTint.onchange = () => {
  prefs.sentenceTint = sentenceTint.checked;
  $('trail').dataset.tint = String(sentenceTint.checked);
  save();
};

function theme(mode) {
  document.documentElement.dataset.theme = mode;
  document.querySelector('meta[name="theme-color"]').content = mode === 'dark' ? '#000000' : '#fff9f8';
  $('theme').checked = mode === 'dark';
}
theme(prefs.theme === 'dark' ? 'dark' : 'light');
$('theme').onchange = () => {
  prefs.theme = $('theme').checked ? 'dark' : 'light';
  theme(prefs.theme);
  save();
};
for (const [id, alternate, fallback] of [['motion','scroll','fixed'],['typeface','serif','sans']]) {
  const control = $(id);
  control.value = prefs[id] === alternate ? alternate : fallback;
  $('trail').dataset[id] = control.value;
  control.onchange = () => {
    stopMotion();
    prefs[id] = control.value;
    $('trail').dataset[id] = control.value;
    fitWords();
    updateHint();
    save();
  };
}
for (const [id, suffix] of [['size','%'],['fade','%'],['step',' px']]) {
  const control = $(id);
  if (Number.isFinite(prefs[id])) control.value = prefs[id];
  function apply() {
    $(id + '-value').textContent = control.value + suffix;
    if (id === 'fade') $('trail').style.setProperty('--fade', control.value / 100);
  }
  apply();
  control.oninput = () => { prefs[id] = Number(control.value); apply(); fitWords(); save(); };
}

const measure = document.createElement('canvas').getContext('2d');
function fitWords() {
  positionGuide();
  if ($('trail').hidden) return;
  const stage = $('stage');
  const base = Math.min(104, stage.clientWidth * .157, stage.clientHeight * .147) * Number($('size').value) / 100;
  rows.forEach((text, slot) => {
    const distance = Math.abs(slot - 3);
    const target = base * [1,.54,.45,.39][distance];
    measure.font = `${target}px ${getComputedStyle(text).fontFamily}`;
    const available = stage.clientWidth - 20;
    const content = text.textContent.replace('\n', ' ');
    let lines = [content];
    let width = measure.measureText(content).width;
    if (!distance && width > available * 1.4 && content.includes(' ')) {
      const words = content.split(' ');
      for (let split = 1; split < words.length; split++) {
        const candidate = [words.slice(0, split).join(' '), words.slice(split).join(' ')];
        const longest = Math.max(...candidate.map(line => measure.measureText(line).width));
        if (longest < width) { width = longest; lines = candidate; }
      }
    }
    const fitted = lines.join('\n');
    if (text.textContent !== fitted) text.textContent = fitted;
    const guideSpace = !distance && guideMode.value !== 'off' ? 26 : 0;
    const fontSize = Math.min(target, (text.parentElement.clientHeight * .89 - guideSpace) / lines.length, width > available ? target * available / width : target);
    text.style.fontSize = Math.max(1, fontSize) + 'px';
    if (!distance) $('focus-guide').style.setProperty('--focus-height', Math.max(1, fontSize) * lines.length + 'px');
  });
}

function stopMotion() {
  for (const animation of animations.splice(0)) animation.cancel();
  for (const text of rows) text.style.transform = '';
}

function wordPose(text) {
  const box = text.getBoundingClientRect();
  return {y: box.top + box.height / 2, height: box.height, opacity: Number(getComputedStyle(text).opacity)};
}

function setRow(slot, item) {
  const text = rows[slot];
  text.textContent = item?.word ?? item?.punctuation ?? '';
  text.dataset.tone = item ? String(item.sentence % 3) : '';
}

function show(target, move = false) {
  target = Math.max(0, Math.min(last, target));
  const delta = target - index;
  const scroll = move && delta !== 0 && Math.abs(delta) <= 3 && $('motion').value === 'scroll'
    && !items[index].picture && !items[target].picture;
  const previous = scroll ? new Map(visibleItems.map((item, slot) => [item, wordPose(rows[slot])])) : null;
  stopMotion();
  index = target;
  const item = items[index];
  updateGuide();
  if (move && delta) respondGuide();
  $('trail').hidden = Boolean(item.picture);
  $('picture').hidden = !item.picture;
  if (item.picture) {
    $('art').alt = item.picture.alt;
    $('art').src = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960">${item.picture.art}</svg>`);
  } else {
    visibleItems = [];
    visibleItems[3] = index;
    setRow(3, item);
    for (const direction of [-1, 1]) {
      let neighbor = index;
      for (let distance = 1; distance <= 3; distance++) {
        do { neighbor += direction; } while (items[neighbor]?.picture);
        visibleItems[3 + distance * direction] = neighbor;
        setRow(3 + distance * direction, items[neighbor]);
      }
    }
    fitWords();
    if (previous) {
      const spacing = wordPose(rows[5]).y - wordPose(rows[4]).y;
      rows.forEach((text, slot) => {
        if (!text.textContent) return;
        const end = wordPose(text);
        const start = previous.get(visibleItems[slot]) ?? {y:end.y + delta * spacing, height:end.height, opacity:0};
        animations.push(text.animate([
          {transform:`translateY(${start.y - end.y}px) scale(${reducedMotion.matches ? 1 : start.height / end.height})`, opacity:start.opacity},
          {transform:'none', opacity:end.opacity}
        ], {duration:reducedMotion.matches ? 160 : 280, easing:'cubic-bezier(.18,.7,.25,1)'}));
      });
    }
  }
  const fraction = item.start / (tokens.length - 1);
  const progress = Math.round(fraction * 100);
  $('position').textContent = item.picture ? `Illustration ${item.plate} of ${illustrations.length}`
    : item.punctuation ? 'End of sentence'
    : item.lastNumber ? `Words ${item.number}–${item.lastNumber} of ${wordCount}`
    : `Word ${item.number} of ${wordCount}`;
  $('percentage').textContent = progress + '%';
  $('progress').value = index;
  $('scrubber').style.setProperty('--progress', index / last);
  $('progress').setAttribute('aria-valuetext', $('position').textContent);
  $('spoken').textContent = item.word ?? item.picture?.alt ?? `End of sentence ${item.punctuation}`;
  updateHint();
}

function updateHint() {
  $('hint').textContent = index === last ? 'End of story · Swipe down to go back'
    : $('motion').value === 'scroll' ? 'Scroll mode · Swipe up or scroll to read' : 'Swipe up or scroll to read';
}

$('progress').oninput = () => show(Number($('progress').value));
$('settings').onclick = () => $('panel').showModal();
for (const [name, picture] of [['Beginning', null], ...illustrations.map(picture => [picture.name, picture])]) {
  const button = document.createElement('button');
  button.className = 'jump';
  button.textContent = name;
  button.onclick = () => { $('panel').close(); show(picture ? items.findIndex(item => item.picture === picture) : 0); $('stage').focus(); };
  $('jumps').append(button);
}

const stage = $('stage');
let drag;
stage.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  stage.setPointerCapture(event.pointerId);
  drag = {id:event.pointerId, origin:event.clientY, previousY:event.clientY, stopped:false};
});
stage.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId || drag.stopped) return;
  moveGuide(drag.previousY - event.clientY);
  drag.previousY = event.clientY;
  const delta = drag.origin - event.clientY;
  const distance = Number($('step').value);
  const scrolling = $('motion').value === 'scroll';
  if (scrolling && !items[index].picture) {
    stopMotion();
    const fraction = Math.max(-1, Math.min(1, delta / distance));
    const direction = Math.sign(fraction);
    if (direction && items[index + direction]) {
      const centers = rows.map(text => wordPose(text).y);
      rows.forEach((text, slot) => {
        const destination = centers[slot - direction] ?? centers[slot] - direction * (centers[5] - centers[4]);
        text.style.transform = `translateY(${(destination - centers[slot]) * Math.abs(fraction)}px)`;
      });
    }
  }
  const steps = Math.floor(Math.abs(delta) / distance);
  const count = scrolling ? Math.min(1, steps) : steps;
  const direction = Math.sign(delta);
  if (!count) return;
  let target = index;
  for (let i = 0; i < count; i++) {
    target = Math.max(0, Math.min(last, target + direction));
    if (items[target].picture || target === 0 || target === last) { drag.stopped = true; break; }
  }
  drag.origin -= direction * count * distance;
  show(target, true);
});
stage.addEventListener('pointerup', event => {
  if (drag?.id !== event.pointerId || drag.stopped || $('motion').value !== 'scroll') return;
  const delta = drag.origin - event.clientY;
  if (Math.abs(delta) >= Number($('step').value) * .5) show(index + Math.sign(delta), true);
});
stage.addEventListener('lostpointercapture', () => {
  if (drag && rows.some(text => text.style.transform)) stopMotion();
  drag = undefined;
});

let wheelTime = -Infinity;
let wheelTotal = 0;
let wheelStopped = false;
document.addEventListener('wheel', event => {
  if ($('panel').open || event.ctrlKey || !event.deltaY || event.target.closest('input,select,button')) return;
  event.preventDefault();
  if (event.timeStamp - wheelTime > 160) { wheelTotal = 0; wheelStopped = false; }
  wheelTime = event.timeStamp;
  if (wheelStopped) return;
  const pixels = event.deltaMode === 1 ? event.deltaY * 40 : event.deltaMode === 2 ? event.deltaY * 100 : event.deltaY;
  moveGuide(pixels);
  wheelTotal += pixels;
  if (Math.abs(wheelTotal) < 38) return;
  show(index + Math.sign(wheelTotal), true);
  wheelTotal = 0;
  wheelStopped = Boolean(items[index].picture);
}, {passive:false});

document.addEventListener('keydown', event => {
  if ($('panel').open || event.target.closest('button,input') || event.altKey || event.ctrlKey || event.metaKey) return;
  const key = event.key;
  if (!['ArrowDown','ArrowUp','Home','End'].includes(key)) return;
  event.preventDefault();
  if (key.startsWith('Arrow')) moveGuide(Number($('step').value) * (key === 'ArrowDown' ? 1 : -1));
  show(key === 'Home' ? 0 : key === 'End' ? last : index + (key === 'ArrowDown' ? 1 : -1), key.startsWith('Arrow'));
});
new ResizeObserver(fitWords).observe(stage);
groupWords(Number(focusCount.value));
</script>
</body>
</html>
